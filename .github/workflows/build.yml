name: Build Clutch

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-xcode:
    name: Build with Xcode
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Select Xcode version
      run: |
        # List available Xcode versions
        ls /Applications | grep Xcode
        # Use latest Xcode
        sudo xcode-select -p

    - name: Disable code signing
      run: |
        # Find the iOS SDK path
        SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
        echo "SDK Path: $SDK_PATH"

        # Disable code signing requirement for ad-hoc builds
        sudo /usr/libexec/PlistBuddy -c "Set :DefaultProperties:CODE_SIGNING_REQUIRED NO" "$SDK_PATH/SDKSettings.plist" || true
        sudo /usr/libexec/PlistBuddy -c "Set :DefaultProperties:AD_HOC_CODE_SIGNING_ALLOWED YES" "$SDK_PATH/SDKSettings.plist" || true

    - name: Build with xcodebuild
      run: |
        xcodebuild clean build \
          -project Clutch.xcodeproj \
          -scheme Clutch \
          -sdk iphoneos \
          -configuration Release \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          AD_HOC_CODE_SIGNING_ALLOWED=YES \
          DEVELOPMENT_TEAM="" \
          ARCHS="arm64" \
          ONLY_ACTIVE_ARCH=NO \
          IPHONEOS_DEPLOYMENT_TARGET=12.0

    - name: Install ldid
      run: |
        brew install ldid

    - name: Find and prepare binary
      run: |
        # Find the built binary
        BUILD_DIR=$(xcodebuild -project Clutch.xcodeproj -scheme Clutch -sdk iphoneos -configuration Release -showBuildSettings | grep -m 1 "BUILT_PRODUCTS_DIR" | awk '{print $3}')
        echo "Build directory: $BUILD_DIR"

        # Create output directory
        mkdir -p output

        # Copy binary (it's inside the .app bundle)
        if [ -f "$BUILD_DIR/Clutch.app/Clutch" ]; then
          cp "$BUILD_DIR/Clutch.app/Clutch" output/Clutch
          echo "Binary found in .app bundle"
        elif [ -f "$BUILD_DIR/Clutch" ]; then
          cp "$BUILD_DIR/Clutch" output/Clutch
          echo "Binary found directly"
        else
          echo "Searching for Clutch binary..."
          find ~/Library/Developer/Xcode/DerivedData -name "Clutch" -type f 2>/dev/null | head -5
        fi

        # Copy entitlements for signing on device
        cp Clutch/Clutch.entitlements output/

        # Sign with ldid using entitlements
        if [ -f output/Clutch ]; then
          echo "Signing binary with ldid..."
          ldid -SClutch/Clutch.entitlements output/Clutch
          echo "Binary signed successfully"
        fi

        # Show binary info
        if [ -f output/Clutch ]; then
          file output/Clutch
          ls -la output/
        fi

    - name: Upload Xcode build artifact
      uses: actions/upload-artifact@v4
      with:
        name: Clutch-xcode
        path: output/
        if-no-files-found: warn

  build-cmake:
    name: Build with CMake
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew install cmake ldid

    - name: Select Xcode version
      run: |
        sudo xcode-select -p

    - name: Disable code signing
      run: |
        SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
        echo "SDK Path: $SDK_PATH"
        sudo /usr/libexec/PlistBuddy -c "Set :DefaultProperties:CODE_SIGNING_REQUIRED NO" "$SDK_PATH/SDKSettings.plist" || true
        sudo /usr/libexec/PlistBuddy -c "Set :DefaultProperties:AD_HOC_CODE_SIGNING_ALLOWED YES" "$SDK_PATH/SDKSettings.plist" || true

    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE=../cmake/iphoneos.toolchain.cmake \
              ..

    - name: Build with CMake
      run: |
        cd build
        make -j$(sysctl -n hw.logicalcpu)

    - name: Prepare artifacts
      run: |
        mkdir -p output

        # Copy built binary
        if [ -f build/build/Clutch ]; then
          cp build/build/Clutch output/Clutch
        elif [ -f build/Clutch/Clutch ]; then
          cp build/Clutch/Clutch output/Clutch
        elif [ -f build/Clutch.app/Clutch ]; then
          cp build/Clutch.app/Clutch output/Clutch
        fi

        # Copy entitlements
        cp Clutch/Clutch.entitlements output/

        # Sign with ldid using entitlements
        if [ -f output/Clutch ]; then
          echo "Signing binary with ldid..."
          ldid -SClutch/Clutch.entitlements output/Clutch
          echo "Binary signed successfully"
        fi

        # Show binary info
        if [ -f output/Clutch ]; then
          file output/Clutch
          ls -la output/
        fi

    - name: Upload CMake build artifact
      uses: actions/upload-artifact@v4
      with:
        name: Clutch-cmake
        path: output/
        if-no-files-found: warn

  release:
    name: Create Release
    needs: [build-xcode, build-cmake]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download Xcode artifact
      uses: actions/download-artifact@v4
      with:
        name: Clutch-xcode
        path: xcode-build

    - name: Download CMake artifact
      uses: actions/download-artifact@v4
      with:
        name: Clutch-cmake
        path: cmake-build

    - name: Get version
      id: version
      run: |
        VERSION=$(grep -oP 'MACOSX_BUNDLE_SHORT_VERSION_STRING "\K[^"]+' CMakeLists.txt || echo "2.0.4")
        COMMIT_SHORT=$(git rev-parse --short HEAD)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "commit=$COMMIT_SHORT" >> $GITHUB_OUTPUT
        echo "Version: $VERSION, Commit: $COMMIT_SHORT"

    - name: Prepare release files
      run: |
        mkdir -p release

        # Prefer xcode build, fallback to cmake
        if [ -f xcode-build/Clutch ]; then
          cp xcode-build/Clutch release/Clutch
          cp xcode-build/Clutch.entitlements release/
        elif [ -f cmake-build/Clutch ]; then
          cp cmake-build/Clutch release/Clutch
          cp cmake-build/Clutch.entitlements release/
        fi

        # Create zip for release
        cd release
        zip -r ../Clutch-${{ steps.version.outputs.version }}-${{ steps.version.outputs.commit }}.zip .

    - name: Build .deb package
      run: |
        VERSION=${{ steps.version.outputs.version }}

        # Create package directory structure
        mkdir -p deb-package/DEBIAN
        mkdir -p deb-package/var/jb/usr/bin

        # Copy binary
        if [ -f xcode-build/Clutch ]; then
          cp xcode-build/Clutch deb-package/var/jb/usr/bin/Clutch
        elif [ -f cmake-build/Clutch ]; then
          cp cmake-build/Clutch deb-package/var/jb/usr/bin/Clutch
        fi

        chmod 755 deb-package/var/jb/usr/bin/Clutch

        # Create control file
        cat > deb-package/DEBIAN/control << CTRL
        Package: com.ancry.clutch
        Name: Clutch
        Version: ${VERSION}
        Architecture: iphoneos-arm64
        Description: High-speed iOS decryption tool for educational purposes and security research. Supports rootless jailbreaks (Dopamine, palera1n).
        Maintainer: AnCry1596
        Author: KJCracks, AnCry1596
        Section: Utilities
        Depends: firmware (>= 12.0)
        CTRL

        # Remove leading spaces from control file
        sed -i 's/^        //' deb-package/DEBIAN/control

        # Create postinst script
        cat > deb-package/DEBIAN/postinst << 'POSTINST'
        #!/bin/bash
        if [ -d "/var/jb" ]; then
            chmod 755 /var/jb/usr/bin/Clutch
        else
            cp /var/jb/usr/bin/Clutch /usr/bin/Clutch 2>/dev/null || true
            chmod 755 /usr/bin/Clutch 2>/dev/null || true
        fi
        if [ -f "/usr/bin/inject" ]; then
            /usr/bin/inject /usr/bin/Clutch 2>/dev/null || true
        fi
        exit 0
        POSTINST

        sed -i 's/^        //' deb-package/DEBIAN/postinst
        chmod 755 deb-package/DEBIAN/postinst

        # Build .deb package
        dpkg-deb --build deb-package "com.ancry.clutch_${VERSION}_iphoneos-arm64.deb"

        ls -la *.deb

    - name: Upload release zip
      uses: actions/upload-artifact@v4
      with:
        name: Clutch-release-${{ steps.version.outputs.version }}-${{ steps.version.outputs.commit }}
        path: Clutch-*.zip

    - name: Upload .deb package
      uses: actions/upload-artifact@v4
      with:
        name: Clutch-deb-${{ steps.version.outputs.version }}
        path: "*.deb"
